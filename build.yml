name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      # This runs the ENTIRE build inside Kivy's own official Docker image,
      # which bundles a tested, mutually-compatible NDK/SDK/Python/pip.
      # We stop hand-assembling that toolchain on the bare runner, which is
      # what caused every previous failure (NDK/GL mismatches, python3 vs
      # hostpython3 drift, broken pip internals from unpinned host tools).
      - name: Build debug APK (via kivy/buildozer Docker image)
        uses: ArtemSBulgakov/buildozer-action@v2
        with:
          workdir: .
          buildozer_version: stable
          buildozer_cmd: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: bin/*.apk

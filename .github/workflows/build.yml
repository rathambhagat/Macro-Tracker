name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs the build inside Kivy's own official Docker image, which
      # bundles a tested, mutually-compatible NDK/SDK/Python/pip. This
      # avoids hand-assembling that toolchain on the bare runner, which is
      # what caused earlier failures (NDK/GL mismatches, python3 vs
      # hostpython3 drift, broken pip internals from unpinned host tools).
      - name: Build debug APK (via kivy/buildozer Docker image)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: ${{ steps.buildozer.outputs.filename }}

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory (SDK/NDK downloads)
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      # Calls the official kivy/buildozer Docker image directly instead of
      # going through a third-party wrapper action. That image already
      # bundles a tested, matched NDK/SDK/Python/JDK - no extra install
      # steps needed, which avoids the wrapper action's own broken Java-PPA
      # layer that failed on the image's current Ubuntu base.
      - name: Pull kivy/buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: Build debug APK
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            --volume "${{ github.workspace }}/.buildozer_global":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: bin/*.apk

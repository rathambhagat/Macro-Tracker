name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force python3 to use Python 3.11
        run: |
          sudo ln -sf "$(which python)" /usr/local/bin/python3
          python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            patch \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev \
            libssl-dev \
            build-essential \
            openjdk-17-jdk-headless

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 virtualenv cython==0.29.36

      - name: Clean old Buildozer state
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer
          rm -rf .buildozer_global
          rm -rf bin

      - name: Build debug APK
        run: |
          python -m buildozer android debug
        env:
          CI: true
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Fix APK permissions
        run: |
          sudo chown -R "$USER:$USER" bin || true
          sudo chmod -R u+rwX bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: bin/*.apk
          if-no-files-found: error
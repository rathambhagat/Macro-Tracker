name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Buildozer container user must be able to write into the mounted repo.
      - name: Make workspace writable for Buildozer container
        run: sudo chmod -R a+rwX "${{ github.workspace }}"

      - name: Pull kivy/buildozer image
        run: docker pull ghcr.io/kivy/buildozer:latest

      # Do NOT mount .buildozer_global for the first successful build.
      # Let the official image use its own internal SDK/NDK state.
      - name: Build debug APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            --workdir /home/user/hostcwd \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -lc "buildozer android debug"

      - name: Fix APK permissions
        run: |
          sudo chown -R "$USER:$USER" bin || true
          sudo chmod -R u+rwX bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-apk
          path: bin/*.apk
          if-no-files-found: error